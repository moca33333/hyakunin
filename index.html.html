<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5色百人一首 読み上げアプリ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
    background: #1a1a2e;
    color: #eee;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 {
    font-size: 1.6rem;
    margin-bottom: 20px;
    color: #f0e0b0;
    letter-spacing: 0.2em;
  }

  /* 色選択 */
  .color-section { margin-bottom: 16px; width: 100%; max-width: 700px; }
  .color-section h2 { font-size: 0.9rem; color: #aaa; margin-bottom: 8px; letter-spacing: 0.1em; }
  .color-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .color-btn {
    padding: 8px 18px;
    border: 2px solid transparent;
    border-radius: 24px;
    cursor: pointer;
    font-size: 0.95rem;
    font-family: inherit;
    font-weight: bold;
    transition: all 0.2s;
    opacity: 0.7;
  }
  .color-btn:hover { opacity: 1; transform: scale(1.05); }
  .color-btn.active { opacity: 1; border-color: #fff; transform: scale(1.05); }
  .btn-blue   { background: #3a7bd5; color: #fff; }
  .btn-pink   { background: #e8609a; color: #fff; }
  .btn-yellow { background: #d4a017; color: #fff; }
  .btn-green  { background: #3a9d5c; color: #fff; }
  .btn-orange { background: #e8722a; color: #fff; }
  .btn-all    { background: #6a5acd; color: #fff; }

  /* モード選択 */
  .mode-section { margin-bottom: 20px; width: 100%; max-width: 700px; }
  .mode-section h2 { font-size: 0.9rem; color: #aaa; margin-bottom: 8px; letter-spacing: 0.1em; }
  .mode-btns { display: flex; gap: 8px; }
  .mode-btn {
    padding: 8px 20px;
    border: 2px solid #555;
    border-radius: 24px;
    cursor: pointer;
    font-size: 0.9rem;
    font-family: inherit;
    background: #2a2a4a;
    color: #ccc;
    transition: all 0.2s;
  }
  .mode-btn.active { border-color: #f0e0b0; color: #f0e0b0; background: #3a3a5a; }

  /* 速度設定 */
  .speed-section { margin-bottom: 20px; width: 100%; max-width: 700px; display: flex; align-items: center; gap: 12px; }
  .speed-section label { font-size: 0.85rem; color: #aaa; white-space: nowrap; }
  input[type=range] { flex: 1; accent-color: #f0e0b0; }
  .speed-val { font-size: 0.85rem; color: #f0e0b0; min-width: 40px; }

  @keyframes cardFadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes shimmer {
    0%,100% { text-shadow: 0 0 8px rgba(240,200,80,0.5); }
    50%      { text-shadow: 0 0 20px rgba(240,200,80,1), 0 0 40px rgba(240,160,40,0.6); }
  }

  /* メイン表示エリア */
  .card {
    width: 100%;
    max-width: 700px;
    background: radial-gradient(ellipse at 50% 30%, #1e2a4a 0%, #0e1220 100%);
    border-radius: 16px;
    padding: 36px 32px 28px;
    margin-bottom: 24px;
    border: 1px solid #2a3a6a;
    box-shadow: 0 0 40px rgba(60,80,160,0.25), inset 0 1px 0 rgba(255,255,255,0.05);
    min-height: 280px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    animation: cardFadeIn 0.6s ease;
  }
  .poem-number {
    position: absolute;
    top: 12px;
    left: 18px;
    font-size: 0.8rem;
    color: #666;
  }
  .poem-color-badge {
    position: absolute;
    top: 12px;
    right: 18px;
    font-size: 0.75rem;
    padding: 2px 10px;
    border-radius: 12px;
    font-weight: bold;
  }
  .progress-info {
    position: absolute;
    bottom: 12px;
    right: 18px;
    font-size: 0.75rem;
    color: #555;
  }
  .poet {
    font-size: 0.82rem;
    color: #8899bb;
    margin-bottom: 20px;
    letter-spacing: 0.15em;
  }

  /* 句ブロック */
  .ku-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    margin-bottom: 10px;
    width: 100%;
  }
  .ku-block.shimo-block { margin-bottom: 0; }
  .phrase-span {
    font-size: 1.45rem;
    letter-spacing: 0.18em;
    color: #4a5a7a;
    transition: color 0.3s, text-shadow 0.3s;
    line-height: 1.8;
  }
  .phrase-span.done  { color: #8890a8; }
  .phrase-span.active {
    color: #f5e090;
    animation: shimmer 1.2s ease-in-out infinite;
  }
  .ku-divider {
    width: 40px;
    height: 1px;
    background: linear-gradient(to right, transparent, #334, transparent);
    margin: 6px 0 10px;
  }

  .status-msg {
    font-size: 0.78rem;
    color: #556;
    margin-top: 14px;
    letter-spacing: 0.1em;
  }
  .idle-msg {
    font-size: 1rem;
    color: #556;
    text-align: center;
    line-height: 2.2;
  }

  /* コントロールボタン */
  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .ctrl-btn {
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
    font-family: inherit;
    font-weight: bold;
    transition: all 0.15s;
  }
  .ctrl-btn:active { transform: scale(0.96); }
  .btn-play  { background: #f0e0b0; color: #1a1a2e; min-width: 100px; }
  .btn-prev  { background: #2a2a5a; color: #ccc; border: 1px solid #444; }
  .btn-next  { background: #2a2a5a; color: #ccc; border: 1px solid #444; }
  .btn-stop  { background: #5a2a2a; color: #fcc; border: 1px solid #844; }
  .ctrl-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* 一覧 */
  .list-section { width: 100%; max-width: 700px; }
  .list-toggle {
    background: none;
    border: 1px solid #444;
    color: #aaa;
    padding: 6px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.85rem;
    margin-bottom: 10px;
  }
  .poem-list { display: none; flex-direction: column; gap: 4px; max-height: 320px; overflow-y: auto; }
  .poem-list.open { display: flex; }
  .list-item {
    display: flex;
    gap: 10px;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.8rem;
    color: #aaa;
    transition: background 0.1s;
    align-items: center;
  }
  .list-item:hover { background: #2a2a4a; color: #eee; }
  .list-item.current { background: #2a3a6a; color: #f0e0b0; }
  .list-item.done { color: #666; }
  .list-num { min-width: 28px; color: #666; font-size: 0.75rem; }
  .list-poet { min-width: 120px; }
  .list-kami { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
</style>
</head>
<body>

<h1>五色百人一首　読み上げ</h1>

<div class="color-section">
  <h2>色を選ぶ</h2>
  <div class="color-btns">
    <button class="color-btn btn-blue  active" data-color="blue"  onclick="selectColor('blue')">青（1〜20番）</button>
    <button class="color-btn btn-pink"          data-color="pink"  onclick="selectColor('pink')">桃（21〜40番）</button>
    <button class="color-btn btn-yellow"        data-color="yellow" onclick="selectColor('yellow')">黄（41〜60番）</button>
    <button class="color-btn btn-green"         data-color="green" onclick="selectColor('green')">緑（61〜80番）</button>
    <button class="color-btn btn-orange"        data-color="orange" onclick="selectColor('orange')">橙（81〜100番）</button>
    <button class="color-btn btn-all"           data-color="all"   onclick="selectColor('all')">全色（100首）</button>
  </div>
</div>

<div class="mode-section">
  <h2>読み上げ順</h2>
  <div class="mode-btns">
    <button class="mode-btn active" id="btn-seq" onclick="setMode('seq')">▶ 順番読み</button>
    <button class="mode-btn"        id="btn-rnd" onclick="setMode('rnd')">🔀 ランダム読み</button>
  </div>
</div>

<div class="speed-section">
  <label>読み上げ速度</label>
  <input type="range" id="speedRange" min="0.4" max="1.2" step="0.05" value="0.62" oninput="updateSpeed()">
  <span class="speed-val" id="speedVal">0.62</span>
</div>
<div class="speed-section">
  <label>句の間（秒）</label>
  <input type="range" id="pauseRange" min="0.2" max="3.0" step="0.1" value="0.7" oninput="updatePause()">
  <span class="speed-val" id="pauseVal">0.7s</span>
  <label style="margin-left:16px;">
    <input type="checkbox" id="jokaCheck" checked style="accent-color:#f0e0b0;">
    <span style="font-size:0.85rem;color:#aaa;">序歌を読む</span>
  </label>
</div>

<div class="card" id="mainCard">
  <div class="idle-msg">色と読み方を選んで<br>▶ スタート を押してください</div>
</div>

<div class="controls">
  <button class="ctrl-btn btn-prev" id="btnPrev" onclick="goPrev()" disabled>◀ 前の歌</button>
  <button class="ctrl-btn btn-play" id="btnPlay" onclick="togglePlay()">▶ スタート</button>
  <button class="ctrl-btn btn-next" id="btnNext" onclick="goNext()" disabled>次の歌 ▶</button>
  <button class="ctrl-btn btn-stop" id="btnStop" onclick="stopAll()" disabled>■ 停止</button>
</div>

<div class="list-section">
  <button class="list-toggle" onclick="toggleList()">選択中の歌一覧を表示 ▼</button>
  <div class="poem-list" id="poemList"></div>
</div>

<script>

const COLOR_INFO = {
  blue:   { label:"青",  range:[1,20],   bg:"#3a7bd5", badge:"#3a7bd5" },
  pink:   { label:"桃",  range:[21,40],  bg:"#e8609a", badge:"#e8609a" },
  yellow: { label:"黄",  range:[41,60],  bg:"#d4a017", badge:"#d4a017" },
  green:  { label:"緑",  range:[61,80],  bg:"#3a9d5c", badge:"#3a9d5c" },
  orange: { label:"橙",  range:[81,100], bg:"#e8722a", badge:"#e8722a" },
  all:    { label:"全",  range:[1,100],  bg:"#6a5acd", badge:"#6a5acd" },
};

function getColorFor(n) {
  if (n <= 20)  return 'blue';
  if (n <= 40)  return 'pink';
  if (n <= 60)  return 'yellow';
  if (n <= 80)  return 'green';
  return 'orange';
}

let selectedColor = 'blue';
let mode = 'seq';
let queue = [];
let queueIndex = 0;
let doneSet = new Set();
let isPlaying = false;
let speed = 0.62;
let innerPauseMs = 700;
let currentUtterance = null;

function selectColor(c) {
  selectedColor = c;
  document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-color="${c}"]`).classList.add('active');
  stopAll();
  buildQueue();
  renderList();
  renderIdleCard();
}

function setMode(m) {
  mode = m;
  document.getElementById('btn-seq').classList.toggle('active', m === 'seq');
  document.getElementById('btn-rnd').classList.toggle('active', m === 'rnd');
  stopAll();
  buildQueue();
  renderList();
  renderIdleCard();
}

function updateSpeed() {
  speed = parseFloat(document.getElementById('speedRange').value);
  document.getElementById('speedVal').textContent = speed.toFixed(2);
}
function updatePause() {
  innerPauseMs = Math.round(parseFloat(document.getElementById('pauseRange').value) * 1000);
  document.getElementById('pauseVal').textContent = (innerPauseMs / 1000).toFixed(1) + 's';
}

function buildQueue() {
  const info = COLOR_INFO[selectedColor];
  let filtered = POEMS.filter(p => p.n >= info.range[0] && p.n <= info.range[1]);
  if (mode === 'rnd') {
    filtered = shuffle([...filtered]);
  }
  queue = filtered;
  queueIndex = 0;
  doneSet = new Set();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function renderIdleCard() {
  document.getElementById('mainCard').innerHTML = `<div class="idle-msg">色と読み方を選んで<br>▶ スタート を押してください</div>`;
}

function renderCard(poem) {
  const ci = COLOR_INFO[getColorFor(poem.n)];
  const kamiPhrases = splitPhrases(poem.kami);
  const shimoPhrases = splitPhrases(poem.shimo);

  const kamiHTML = kamiPhrases.map((p, i) =>
    `<span class="phrase-span" id="phrase-k-${i}">${p}</span>`).join('');
  const shimoHTML = shimoPhrases.map((p, i) =>
    `<span class="phrase-span" id="phrase-s-${i}">${p}</span>`).join('');

  document.getElementById('mainCard').innerHTML = `
    <span class="poem-number">${poem.n}番</span>
    <span class="poem-color-badge" style="background:${ci.badge}">${ci.label}札</span>
    <div class="poet">${poem.poet}</div>
    <div class="ku-block" id="kamiBlock">${kamiHTML}</div>
    <div class="ku-divider"></div>
    <div class="ku-block shimo-block" id="shimoBlock">${shimoHTML}</div>
    <div class="status-msg" id="statusMsg">読み上げ中...</div>
    <span class="progress-info">${queueIndex + 1} / ${queue.length}</span>
  `;
}

function setAllPhraseClass(prefix, count, cls) {
  for (let i = 0; i < count; i++) {
    const el = document.getElementById(`${prefix}-${i}`);
    if (el) { el.className = 'phrase-span'; if (cls) el.classList.add(cls); }
  }
}

function highlightKami() {}   // 句単位はspeakPhrasesで管理
function highlightShimo() {}
function clearHighlight() {
  document.querySelectorAll('.phrase-span').forEach(el => {
    el.className = 'phrase-span done';
  });
}

function setStatus(msg) {
  const el = document.getElementById('statusMsg');
  if (el) el.textContent = msg;
}

// TTS: 1フレーズを読み上げる
function speak(text, onEnd) {
  if (currentUtterance) window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ja-JP';
  utter.rate = speed;
  utter.pitch = 0.82;   // 低めで荘重な読み
  utter.volume = 1.0;
  utter.onend = onEnd;
  utter.onerror = onEnd;
  currentUtterance = utter;
  window.speechSynthesis.speak(utter);
}

// フレーズを1つずつ読み（末尾に「、」で息継ぎ）＋ハイライト
async function speakPhrases(phrases, idPrefix) {
  for (let i = 0; i < phrases.length; i++) {
    if (!isPlaying) return;
    // 前のフレーズを「読了」スタイルに
    if (idPrefix && i > 0) {
      const prev = document.getElementById(`${idPrefix}-${i - 1}`);
      if (prev) { prev.className = 'phrase-span done'; }
    }
    // 現在フレーズをアクティブに
    if (idPrefix) {
      const cur = document.getElementById(`${idPrefix}-${i}`);
      if (cur) { cur.className = 'phrase-span active'; }
    }
    const isLast = i === phrases.length - 1;
    const text = isLast ? phrases[i] : phrases[i] + '、';
    await new Promise(r => speak(text, r));
  }
  // 最後のフレーズを読了に
  if (idPrefix && phrases.length > 0) {
    const last = document.getElementById(`${idPrefix}-${phrases.length - 1}`);
    if (last) { last.className = 'phrase-span done'; }
  }
}

// 「　」区切りでフレーズ分割
function splitPhrases(text) {
  return text.split('　').map(s => s.trim()).filter(Boolean);
}

function readPoem(poem) {
  renderCard(poem);
  updateListHighlight();
  const pause = (ms) => new Promise(r => setTimeout(r, ms));

  // 句内の間はスライダー連動、その他は比率で自動計算
  const innerPause     = innerPauseMs;
  const kamiShimoPause = innerPauseMs;
  const repeatPause    = innerPauseMs * 1.6;
  const nextPause      = innerPauseMs * 2.0;

  const kamiPhrases = splitPhrases(poem.kami);
  const shimoPhrases = splitPhrases(poem.shimo);

  async function doRead() {
    if (!isPlaying) return;

    // 上の句
    setStatus("上の句");
    await speakPhrases(kamiPhrases, 'phrase-k');
    if (!isPlaying) return;
    await pause(kamiShimoPause);
    if (!isPlaying) return;

    // 下の句（1回目）
    document.querySelectorAll('[id^="phrase-s-"]').forEach(el => el.className = 'phrase-span');
    setStatus("下の句");
    await speakPhrases(shimoPhrases, 'phrase-s');
    if (!isPlaying) return;
    await pause(repeatPause);
    if (!isPlaying) return;

    // 下の句（2回目）
    document.querySelectorAll('[id^="phrase-s-"]').forEach(el => el.className = 'phrase-span');
    setStatus("下の句（繰り返し）");
    await speakPhrases(shimoPhrases, 'phrase-s');
    if (!isPlaying) return;

    clearHighlight();
    doneSet.add(poem.n);
    renderListItem(poem.n);
    await pause(nextPause);
    if (!isPlaying) return;
    nextPoem();
  }
  doRead();
}

function nextPoem() {
  if (!isPlaying) return;
  queueIndex++;
  if (queueIndex >= queue.length) {
    // 全首終了
    isPlaying = false;
    clearHighlight();
    document.getElementById('mainCard').innerHTML = `<div class="idle-msg">全ての歌を読み上げました！<br>お疲れ様でした。</div>`;
    setPlayBtn(false);
    document.getElementById('btnStop').disabled = true;
    updateNavBtns();
    return;
  }
  updateNavBtns();
  readPoem(queue[queueIndex]);
}

function togglePlay() {
  if (!isPlaying) {
    startPlaying();
  } else {
    pausePlaying();
  }
}

async function startPlaying() {
  if (queue.length === 0) buildQueue();
  if (queue.length === 0) return;
  isPlaying = true;
  setPlayBtn(true);
  document.getElementById('btnStop').disabled = false;
  updateNavBtns();
  startAmbient();

  // 序歌（最初の歌から始まる場合のみ）
  const jokaCheck = document.getElementById('jokaCheck');
  if (jokaCheck && jokaCheck.checked && queueIndex === 0) {
    document.getElementById('mainCard').innerHTML = `
      <div class="poet">序歌</div>
      <div class="kami" style="color:#c8d8f0;">難波津に　咲くやこの花　冬ごもり</div>
      <div class="shimo" style="color:#c8d8f0;">今は春べと　咲くやこの花</div>
      <div class="status-msg">序歌を読んでいます...</div>
    `;
    const jokaKami = ['難波津に', '咲くやこの花', '冬ごもり'];
    const jokaShimo = ['今は春べと', '咲くやこの花'];
    await speakPhrases(jokaKami, null);
    if (!isPlaying) return;
    await new Promise(r => setTimeout(r, innerPauseMs * 2.2));
    if (!isPlaying) return;
    await speakPhrases(jokaShimo, null);
    if (!isPlaying) return;
    await new Promise(r => setTimeout(r, innerPauseMs * 2.5));
    if (!isPlaying) return;
  }

  readPoem(queue[queueIndex]);
}

function pausePlaying() {
  isPlaying = false;
  window.speechSynthesis.cancel();
  stopAmbient();
  clearHighlight();
  setStatus("一時停止中");
  setPlayBtn(false);
}

function stopAll() {
  isPlaying = false;
  window.speechSynthesis.cancel();
  stopAmbient();
  currentUtterance = null;
  document.getElementById('btnStop').disabled = true;
  setPlayBtn(false);
  updateNavBtns();
}

function goPrev() {
  if (queueIndex <= 0) return;
  stopAll();
  queueIndex--;
  renderCard(queue[queueIndex]);
  setStatus("▶ スタートで読み上げ開始");
  updateNavBtns();
  updateListHighlight();
}

function goNext() {
  if (queueIndex >= queue.length - 1) return;
  stopAll();
  queueIndex++;
  renderCard(queue[queueIndex]);
  setStatus("▶ スタートで読み上げ開始");
  updateNavBtns();
  updateListHighlight();
}

function setPlayBtn(playing) {
  const btn = document.getElementById('btnPlay');
  btn.textContent = playing ? '⏸ 一時停止' : '▶ スタート';
}

function updateNavBtns() {
  document.getElementById('btnPrev').disabled = (queueIndex <= 0 || queue.length === 0);
  document.getElementById('btnNext').disabled = (queueIndex >= queue.length - 1 || queue.length === 0);
}

// 一覧
let listOpen = false;
function toggleList() {
  listOpen = !listOpen;
  const el = document.getElementById('poemList');
  el.classList.toggle('open', listOpen);
  document.querySelector('.list-toggle').textContent = listOpen ? '選択中の歌一覧を非表示 ▲' : '選択中の歌一覧を表示 ▼';
}

function renderList() {
  const el = document.getElementById('poemList');
  el.innerHTML = '';
  queue.forEach((poem, idx) => {
    const div = document.createElement('div');
    div.className = 'list-item' + (idx === queueIndex ? ' current' : '') + (doneSet.has(poem.n) ? ' done' : '');
    div.id = `list-item-${poem.n}`;
    div.innerHTML = `<span class="list-num">${poem.n}番</span><span class="list-poet">${poem.poet}</span><span class="list-kami">${poem.kami}</span>`;
    div.onclick = () => jumpTo(idx);
    el.appendChild(div);
  });
}

function renderListItem(n) {
  const el = document.getElementById(`list-item-${n}`);
  if (el) el.classList.add('done');
}

function updateListHighlight() {
  document.querySelectorAll('.list-item').forEach((el, idx) => {
    el.classList.toggle('current', idx === queueIndex);
  });
  // スクロール
  const cur = document.querySelector('.list-item.current');
  if (cur) cur.scrollIntoView({ block: 'nearest' });
}

function jumpTo(idx) {
  stopAll();
  queueIndex = idx;
  renderCard(queue[queueIndex]);
  setStatus("▶ スタートで読み上げ開始");
  updateNavBtns();
  updateListHighlight();
}

// ===== 環境音（風音） =====
let ambientCtx = null, ambientGain = null, ambientSource = null;

function startAmbient() {
  if (ambientCtx) return;
  try {
    ambientCtx = new (window.AudioContext || window.webkitAudioContext)();
    const rate = ambientCtx.sampleRate;
    const buf  = ambientCtx.createBuffer(1, rate * 3, rate);
    const data = buf.getChannelData(0);
    // ブラウン雑音（風っぽい）
    let last = 0;
    for (let i = 0; i < data.length; i++) {
      const white = Math.random() * 2 - 1;
      last = (last + 0.02 * white) / 1.02;
      data[i] = last * 12;
    }
    ambientSource = ambientCtx.createBufferSource();
    ambientSource.buffer = buf;
    ambientSource.loop = true;

    const lpf = ambientCtx.createBiquadFilter();
    lpf.type = 'lowpass';
    lpf.frequency.value = 280;

    ambientGain = ambientCtx.createGain();
    ambientGain.gain.value = 0;

    ambientSource.connect(lpf);
    lpf.connect(ambientGain);
    ambientGain.connect(ambientCtx.destination);
    ambientSource.start();
    ambientGain.gain.linearRampToValueAtTime(0.18, ambientCtx.currentTime + 2);
  } catch(e) {}
}

function stopAmbient() {
  if (!ambientCtx) return;
  try {
    ambientGain.gain.linearRampToValueAtTime(0, ambientCtx.currentTime + 1.5);
    setTimeout(() => {
      try { ambientSource.stop(); ambientCtx.close(); } catch(e) {}
      ambientCtx = ambientSource = ambientGain = null;
    }, 1600);
  } catch(e) {}
}

// 初期化
buildQueue();
renderList();
updateNavBtns();
